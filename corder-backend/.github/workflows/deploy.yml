name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corder-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack & pnpm
        run: corepack enable pnpm

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck backend
        run: pnpm run typecheck

      - name: Run backend unit tests
        run: pnpm test

      - name: Build backend
        run: pnpm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_HOST != '' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            ROOT="${{ vars.DEPLOY_REPO_ROOT }}"
            export DEPLOY_REPO_ROOT="$ROOT"
            if [ -f "$ROOT/corder-backend/deploy/remote-deploy.sh" ]; then
              bash "$ROOT/corder-backend/deploy/remote-deploy.sh"
            else
              bash "$ROOT/deploy/remote-deploy.sh"
            fi
